<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirsal Airway Bills Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap">
<style>
:root{
  --green:#006B4F; --green-700:#00543E; --green-800:#003F2F; --green-50:#E7F3EE; --green-100:#CFE7DD;
  --tan:#C49A6C; --tan-50:#F7EFE6;
  --amber:#F0B400; --success:#00B84A; --red:#F0303E; --red-50:#FDECEE;
  --bg:#F4F4F4; --card:#fff; --ink:#1E2A2E; --muted:#5F6B70; --line:#E2E6E8; --line-2:#EEF0F1;
  --radius:12px; --shadow:0 2px 10px rgba(16,40,32,.07); --shadow-lg:0 12px 40px rgba(16,40,32,.18);
  --font:"Noto Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-head:"Nunito","Noto Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
.hidden{display:none!important}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:0 24px;height:64px}
.brand{display:flex;flex-direction:column;line-height:1.05;white-space:nowrap;cursor:pointer}
.brand b{font-family:var(--font-head);font-weight:900;font-size:24px;letter-spacing:.2px}
.brand span{font-size:11.5px;opacity:.85;letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.nav{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{color:#fff;text-decoration:none;padding:9px 16px;border-radius:9px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;opacity:.9;white-space:nowrap}
.nav a svg{width:17px;height:17px;opacity:.9}
.nav a:hover{background:rgba(255,255,255,.1);opacity:1}
.nav a.active{background:#fff;color:var(--green);opacity:1}
.store-pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.store-pill i{width:8px;height:8px;border-radius:50%;background:#ffd34d;display:inline-block}
.store-pill.ok i{background:#5BE38F}
.store-pill.err i{background:#ff6b74}

/* ---------- layout ---------- */
.page{max-width:1320px;margin:0 auto;padding:28px 24px 60px}
.page-title{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 26px}
.page-title h1{font-family:var(--font-head);font-weight:900;color:var(--green);font-size:32px;margin:0;letter-spacing:.2px}
.page-title .ic{width:40px;height:40px;border-radius:11px;background:var(--green-50);color:var(--green);display:grid;place-items:center}
.page-title .ic svg{width:22px;height:22px}
.sub{color:var(--muted);text-align:center;margin:-16px 0 24px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}
.card+.card{margin-top:18px}
.card h2{font-family:var(--font-head);font-weight:800;color:var(--green);font-size:19px;margin:0 0 4px}
.card h3{font-size:15px;margin:0 0 10px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin:18px 0}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border-top:5px solid var(--tan);padding:24px 16px 26px;text-align:center}
.stat .lbl{font-size:17px;font-weight:500;color:#2C3A40;margin-bottom:12px}
.stat .num{display:inline-block;min-width:80px;padding:6px 20px;border-radius:9px;font-family:var(--font-head);font-weight:800;font-size:36px;color:#fff;background:var(--green);line-height:1.25}
.num.amber{background:var(--amber)} .num.ok{background:var(--success)} .num.red{background:var(--red)} .num.tan{background:var(--tan)}
.welcome{display:flex;align-items:center;gap:18px}
.welcome b{color:var(--green);font-size:18px}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s;white-space:nowrap;line-height:1.2}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover{border-color:#c9d0d3;background:#fafbfb}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-700)}
.btn.gold{background:var(--tan);border-color:var(--tan);color:#fff}
.btn.danger{color:var(--red);border-color:#f3c4c8}
.btn.danger:hover{background:var(--red-50)}
.btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#eef1f2}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
.btn.icon{padding:7px;width:34px;height:34px}
.btn.sm.icon{width:28px;height:28px;padding:5px}
.btn.on{background:var(--green-50);border-color:var(--green-100);color:var(--green)}
.btn-group{display:inline-flex}
.btn-group .btn{border-radius:0;margin-left:-1px}
.btn-group .btn:first-child{border-radius:9px 0 0 9px;margin-left:0}
.btn-group .btn:last-child{border-radius:0 9px 9px 0}
.btn-group .btn.sm:first-child{border-radius:7px 0 0 7px}
.btn-group .btn.sm:last-child{border-radius:0 7px 7px 0}
.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%;outline:none;transition:border-color .12s,box-shadow .12s}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,107,79,.12)}
.inp.sm{padding:5px 8px;font-size:13px;border-radius:7px}
textarea.inp{resize:vertical;min-height:64px;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.5px}
label.f{display:block;font-size:12.5px;font-weight:600;color:#3a474c;margin:0 0 5px}
.field{margin-bottom:12px}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px;user-select:none}
.chk input{accent-color:var(--green);width:16px;height:16px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1f2;color:#43525a;white-space:nowrap}
.tag.g{background:var(--green-50);color:var(--green)}
.tag.a{background:#FFF5D6;color:#8a6500}
.tag.r{background:var(--red-50);color:#b3202c}
.tag.t{background:var(--tan-50);color:#8a5e2e}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f1f3f4;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px}
code.ph{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--green-50);color:var(--green);border-radius:5px;padding:1px 5px;font-size:12px}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{position:sticky;top:0;background:#F7F9F9;text-align:left;font-weight:700;color:#3b4a50;font-size:12px;text-transform:uppercase;letter-spacing:.35px;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#FAFCFB}
.tbl tr.sel{background:#F1F8F5}
.tbl .num-c{text-align:right;font-variant-numeric:tabular-nums}
.tbl .muted{color:var(--muted)}
.tbl .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.thumb{width:54px;height:80px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:zoom-in;display:block;object-fit:contain;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.thumb-w{width:54px;height:80px;display:grid;place-items:center}
.ellip{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .inp{width:auto}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .inp{padding-left:32px;min-width:260px}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--green);color:#fff;padding:9px 14px;border-radius:10px;margin-bottom:12px}
.bulkbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.bulkbar .btn:hover{background:rgba(255,255,255,.22)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:12px;color:var(--muted);font-size:13px}

/* ---------- upload ---------- */
.drop{border:2px dashed #b9c9c2;border-radius:14px;background:#fbfdfc;padding:46px 20px;text-align:center;cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--green);background:var(--green-50)}
.drop .big{width:56px;height:56px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.drop .big svg{width:28px;height:28px}
.drop h3{font-family:var(--font-head);font-weight:800;font-size:20px;margin:0 0 6px;color:var(--green)}
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-weight:600;font-size:13px;color:var(--muted)}
.steps span i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e8eced;font-size:12px}
.steps span.on{color:var(--green)} .steps span.on i{background:var(--green);color:#fff}
.steps span.done i{background:var(--green-100);color:var(--green)}
.map-tbl td{padding:6px 10px}
.map-tbl select{min-width:180px}
.map-ok{color:var(--success);font-weight:700}
.map-miss{color:#b0b8bb}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.preview-box{background:#e9eded;border-radius:12px;padding:16px;display:grid;place-items:center;position:sticky;top:84px}
.preview-box canvas{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.15);max-width:100%;height:auto}

/* ---------- templates ---------- */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.tpl-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border-top:5px solid var(--tan)}
.tpl-card .pv{background:#e9eded;height:250px;display:grid;place-items:center;cursor:pointer}
.tpl-card .pv canvas{max-height:226px;max-width:90%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.15)}
.tpl-card .meta{padding:14px 16px 6px}
.tpl-card .meta b{font-size:15.5px;display:block}
.tpl-card .meta small{color:var(--muted)}
.tpl-card .acts{display:flex;gap:6px;padding:10px 12px 14px;flex-wrap:wrap}
.tpl-new{border:2px dashed #c3d0cb;background:transparent;box-shadow:none;display:grid;place-items:center;min-height:360px;cursor:pointer;color:var(--green);font-weight:700;border-top-width:2px}
.tpl-new:hover{background:var(--green-50);border-color:var(--green)}
.tpl-new .big{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto 10px}

/* ---------- modal & toasts ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,24,20,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;animation:fade .12s}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;display:flex;flex-direction:column;max-height:90vh}
.modal.wide{max-width:980px}
.modal.xwide{max-width:1180px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-family:var(--font-head);font-weight:800;font-size:18px;color:var(--green)}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toasts{position:fixed;right:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#1e2a2e;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-weight:500;max-width:420px;animation:fade .15s}
.toast.ok{background:var(--green)} .toast.err{background:#b3202c}
.progress{height:10px;background:#e8eced;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);width:0;transition:width .15s}

/* ---------- order modal ---------- */
.order-view{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
@media (max-width:900px){.order-view{grid-template-columns:1fr}}
.order-view .pv{background:#e9eded;border-radius:12px;padding:18px;display:grid;place-items:center}
.order-view .pv canvas{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.15);max-width:100%;height:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;word-break:break-word}

/* ---------- designer ---------- */
body.designing{overflow:hidden}
body.designing .topbar{display:none}
.designer{position:fixed;inset:0;display:flex;flex-direction:column;background:#E9ECEC;z-index:60}
.d-top{height:56px;flex:none;background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);overflow-x:auto}
.d-top .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.d-top .btn:hover{background:rgba(255,255,255,.2)}
.d-top .btn.primary{background:#fff;color:var(--green);border-color:#fff}
.d-top .btn.on{background:#fff;color:var(--green)}
.d-top .inp{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.d-top .inp option{color:var(--ink)}
.d-top .inp:focus{background:rgba(255,255,255,.18);box-shadow:none;border-color:#fff}
.d-top .name{font-weight:700;font-size:15px;width:220px}
.d-top .sep{width:1px;height:28px;background:rgba(255,255,255,.25);margin:0 4px;flex:none}
.d-top .zoomv{min-width:46px;text-align:center;font-weight:700;font-size:13px}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:#ffd34d;display:inline-block}
.d-body{flex:1;display:flex;min-height:0}
.d-left{width:232px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.d-right{width:300px;flex:none;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:14px 16px 40px}
.d-tabs{display:flex;border-bottom:1px solid var(--line)}
.d-tabs button{flex:1;border:none;background:none;padding:12px 6px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-size:13px}
.d-tabs button.on{color:var(--green);border-bottom-color:var(--green)}
.d-pane{flex:1;overflow:auto;padding:12px}
.pal-title{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:10px 2px 8px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pal-item{border:1px solid var(--line);border-radius:10px;padding:10px 6px;background:#fff;cursor:grab;text-align:center;font-size:12px;font-weight:600;user-select:none;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .12s}
.pal-item svg{width:22px;height:22px;color:var(--green)}
.pal-item:hover{border-color:var(--green);background:var(--green-50)}
.pal-item:active{cursor:grabbing}
.fld-list{display:flex;flex-direction:column;gap:4px}
.fld-chip{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:grab;font-size:12.5px;background:#fff}
.fld-chip:hover{border-color:var(--green);background:var(--green-50)}
.fld-chip b{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld-chip small{color:var(--muted);font-size:11px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layers{display:flex;flex-direction:column;gap:2px}
.layer{display:flex;align-items:center;gap:6px;padding:6px 6px;border-radius:7px;cursor:pointer;font-size:12.5px;border:1px solid transparent}
.layer:hover{background:#f3f6f5}
.layer.sel{background:var(--green-50);border-color:var(--green-100)}
.layer.drop-above{box-shadow:inset 0 2px 0 var(--green)}
.layer.drop-below{box-shadow:inset 0 -2px 0 var(--green)}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .ty{width:18px;height:18px;color:var(--green);flex:none}
.layer .mini{border:none;background:none;padding:2px;cursor:pointer;color:#8a979c;width:22px;height:22px;display:grid;place-items:center;border-radius:5px}
.layer .mini:hover{background:#e6ebea;color:var(--ink)}
.layer .mini svg{width:14px;height:14px}
.layer.off .nm{opacity:.45}
.d-center{flex:1;position:relative;min-width:0}
.d-stage-wrap{position:absolute;inset:0;overflow:auto;display:flex}
.d-pv{position:absolute;right:12px;bottom:10px;display:flex;align-items:center;gap:6px;background:#fff;border-radius:10px;padding:6px 8px;box-shadow:0 3px 14px rgba(0,0,0,.14);color:var(--green)}
.d-pv>svg{width:17px;height:17px}
.d-stage-pad{margin:auto;padding:40px 40px 64px}
.d-stage{position:relative;box-shadow:0 6px 30px rgba(0,0,0,.18);background:#fff}
.d-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.d-grid{position:absolute;inset:0;pointer-events:none}
.d-overlay{position:absolute;inset:0;touch-action:none}
.d-box{position:absolute;outline:1px dashed transparent;cursor:move}
.d-box:hover{outline-color:rgba(0,107,79,.55)}
.d-box.sel{outline:1.5px solid #0A8F6A}
.d-box.locked{cursor:default}
.d-box .hd{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid #0A8F6A;border-radius:2px;margin:-5px 0 0 -5px;z-index:3}
.hd.nw{left:0;top:0;cursor:nwse-resize}.hd.n{left:50%;top:0;cursor:ns-resize}.hd.ne{left:100%;top:0;cursor:nesw-resize}
.hd.e{left:100%;top:50%;cursor:ew-resize}.hd.se{left:100%;top:100%;cursor:nwse-resize}.hd.s{left:50%;top:100%;cursor:ns-resize}
.hd.sw{left:0;top:100%;cursor:nesw-resize}.hd.w{left:0;top:50%;cursor:ew-resize}
.d-box .lbl{position:absolute;left:-1px;top:-19px;background:#0A8F6A;color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px 4px 0 0;white-space:nowrap;pointer-events:none;display:none}
.d-box.sel .lbl{display:block}
.guide{position:absolute;background:#FF2D7A;pointer-events:none;z-index:5}
.guide.v{width:1px;top:0;bottom:0}
.guide.h{height:1px;left:0;right:0}
.marquee{position:absolute;border:1px solid #0A8F6A;background:rgba(10,143,106,.08);pointer-events:none}
.drop-ghost{position:absolute;border:2px dashed var(--green);background:rgba(0,107,79,.06);pointer-events:none}
.d-status{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.92);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);pointer-events:none}
.d-right h4{margin:16px 0 8px;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.d-right h4:first-child{margin-top:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pgrid .field,.pgrid4 .field{margin-bottom:0}
.prop-hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:none;background:#fff;padding:6px 4px;cursor:pointer;font-size:12px;font-weight:600;border-left:1px solid var(--line);display:grid;place-items:center}
.seg button:first-child{border-left:none}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--green);color:#fff}
.color-row{display:flex;gap:6px;align-items:center}
.color-row input[type=color]{width:34px;height:32px;border:1px solid var(--line);border-radius:7px;padding:2px;background:#fff;flex:none;cursor:pointer}
.ins-row{display:flex;gap:6px;margin-top:6px}
.d-empty-sel{color:var(--muted);font-size:13px;background:#F7F9F9;border-radius:10px;padding:12px;margin-bottom:10px}
.fm{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;min-height:480px}
.fm-list{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:62vh}
.fm-item{padding:9px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.fm-item:hover{background:#f7faf9}
.fm-item.on{background:var(--green-50);box-shadow:inset 3px 0 0 var(--green)}
.fm-item b{font-size:13.5px}
.fm-item small{color:var(--muted);font-size:11.5px;display:flex;gap:6px;align-items:center}
.lk-row{display:grid;grid-template-columns:1fr 1.6fr 30px;gap:6px;margin-bottom:6px}
.small-muted{font-size:12px;color:var(--muted)}
.mobile-note{display:none}
@media (max-width:860px){.d-left,.d-right{display:none}.mobile-note{display:block}}

  tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction('kv', mode), s = t.objectStore('kv');
      const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async get(k) { if (this.mem) return clone(this.mem.get(k) ?? null); return (await this.tx('readonly', s => s.get(k))) ?? null; },
  async put(k, v) { if (this.mem) { this.mem.set(k, clone(v)); return; } await this.tx('readwrite', s => s.put(v, k)); },
  async del(k) { if (this.mem) { this.mem.delete(k); return; } await this.tx('readwrite', s => s.delete(k)); },
  async list(prefix) {
    if (this.mem) return [...this.mem.entries()].filter(([k]) => k.startsWith(prefix) && !k.slice(prefix.length).includes('/')).map(([, v]) => clone(v));
    const all = await this.tx('readonly', s => s.getAll(IDBKeyRange.bound(prefix, prefix + '￿')));
    const keys = await this.tx('readonly', s => s.getAllKeys(IDBKeyRange.bound(prefix, prefix + '￿')));
    return all.filter((_, i) => !keys[i].slice(prefix.length).includes('/'));
  }
};

const Store = {
  mode: 'loading', db: null, dl: null, error: null,
  async init() {
    let db = null, dl = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        [db, dl] = await Promise.all([window.claude.use('db').catch(() => null), window.claude.use('downloads').catch(() => null)]);
      }
    } catch (e) { db = null; }
    this.db = db; this.dl = dl;
    if (db) this.mode = 'cloud';
    else { this.mode = 'local'; await IDB.open(); }
  },
  async _c(fn) {
    try { return await withTimeout(fn(), 20000, 'The saved data could not be reached'); }
    catch (e) {
      if (e && (e.code === 'unavailable' || e.code === 'timeout')) { await sleep(400 + Math.random() * 800); return await withTimeout(fn(), 20000, 'The saved data could not be reached'); }
      throw e;
    }
  },
  _plain(snap) { return snap && snap.exists ? clone(snap.data()) : null; },

  async getSettings() {
    if (this.mode === 'cloud') return this._plain(await this._c(() => this.db.doc('app/settings').get()));
    return IDB.get('app/settings');
  },
  async saveSettings(s) {
    if (this.mode === 'cloud') return this._c(() => this.db.doc('app/settings').set(clone(s)));
    return IDB.put('app/settings', s);
  },
  async listTemplates() {
    if (this.mode === 'cloud') { const q = await this._c(() => this.db.collection('templates').get()); return q.docs.map(d => clone(d.data())); }
    return IDB.list('templates/');
  },
  async saveTemplate(t) {
    const size = JSON.stringify(t).length;
    if (size > 245000) throw { code: 'too_big', message: 'This template is too large to save (' + Math.round(size / 1024) + ' KB). Use a smaller logo/image.' };
    if (this.mode === 'cloud') return this._c(() => this.db.collection('templates').doc(t.id).set(clone(t)));
    return IDB.put('templates/' + t.id, t);
  },
  async deleteTemplate(id) {
    if (this.mode === 'cloud') return this._c(() => this.db.collection('templates').doc(id).delete());
    return IDB.del('templates/' + id);
  },
  async listBatches() {
    if (this.mode === 'cloud') { const q = await this._c(() => this.db.collection('batches').get()); return q.docs.map(d => clone(d.data())); }
    return IDB.list('batches/');
  },
  async saveBatch(b) {
    if (this.mode === 'cloud') return this._c(() => this.db.collection('batches').doc(b.id).set(clone(b)));
    return IDB.put('batches/' + b.id, b);
  },
  async getChunks(id) {
    let list;
    if (this.mode === 'cloud') { const q = await this._c(() => this.db.collection('batches/' + id + '/chunks').get()); list = q.docs.map(d => clone(d.data())); }
    else list = await IDB.list('chunks/' + id + '/');
    return list.sort((a, b) => a.id < b.id ? -1 : 1);
  },
  async saveChunk(batchId, c) {
    if (this.mode === 'cloud') return this._c(() => this.db.collection('batches/' + batchId + '/chunks').doc(c.id).set(clone(c)));
    return IDB.put('chunks/' + batchId + '/' + c.id, c);
  },
  async deleteBatch(b) {
    const n = b.chunkCount || 0;
    for (let i = 0; i < n; i++) {
      const cid = 'c' + pad(i, 4);
      if (this.mode === 'cloud') await this._c(() => this.db.collection('batches/' + b.id + '/chunks').doc(cid).delete());
      else await IDB.del('chunks/' + b.id + '/' + cid);
    }
    if (this.mode === 'cloud') return this._c(() => this.db.collection('batches').doc(b.id).delete());
    return IDB.del('batches/' + b.id);
  },
  /* downloads */
  async download(blob, filename) {
    if (this.dl) {
      try { await this.dl.save({ filename, data: blob }); return true; }
      catch (e) {
        if (e && e.code === 'declined') return false;
        if (e && e.code === 'rate_limited') { toast('Another download is waiting for your confirmation.', 'err'); return false; }
        if (!(e && (e.code === 'unavailable' || e.code === 'not_granted' || e.code === 'capability_disabled'))) { toast('Download failed: ' + (e && e.message || e), 'err'); return false; }
      }
    }
    try {
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: filename, style: { display: 'none' } });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 20000);
      return true;
    } catch (e) { toast('Downloads are not available in this view.', 'err'); return false; }
  }
};

async function doImport() {
  const U = S.upload, tb = U.table, tpl = U.draft;
  const prog = progressDialog(`Importing ${nfmt(tb.rows.length)} orders`);
  try {
    learnAliases(tpl);
    await persistTemplate(tpl);
    const batchId = uid('b');
    const genFields = tpl.fields.filter(f => f.generate);
    const rows = tb.rows.map((v, i) => {
      const g = {};
      if (genFields.length) {
        const ctx = makeCtx(tpl, S.settings, { columns: tb.columns, values: v, rowIndex: i });
        for (const f of genFields) if (!ctx.get(f.key)) g[f.key] = generateValue(f.generate, S.settings, i);
      }
      return { i, v, g, p: 0 };
    });
    // chunk by size
    const chunks = []; let cur = [], size = 0;
    for (const r of rows) {
      const sz = JSON.stringify(r).length + 1;
      if (cur.length && (size + sz > 180000 || cur.length >= 1500)) { chunks.push(cur); cur = []; size = 0; }
      cur.push(r); size += sz;
    }
    if (cur.length) chunks.push(cur);
    const b = { id: batchId, name: U.name || U.file.name, fileName: U.file.name, createdAt: Date.now(), templateId: tpl.id, columns: tb.columns, mapping: Object.fromEntries(tpl.fields.map(f => [f.key, f.column || ''])), count: rows.length, printed: 0, chunkCount: chunks.length };
    for (let i = 0; i < chunks.length; i++) {
      if (prog.cancelled) throw { code: 'cancelled' };
      await Store.saveChunk(batchId, { id: 'c' + pad(i, 4), rows: chunks[i] });
      prog.set((i + 1) / (chunks.length + 1), `Saving part ${i + 1} of ${chunks.length}…`);
    }
    await Store.saveBatch(b);
    if (genFields.length) await saveSettings();
    S.batches.push(b);
    S.data.set(batchId, { chunks: chunks.map((c, i) => ({ id: 'c' + pad(i, 4), rows: c })), rows: rows });
    chunks.forEach((c, ci) => c.forEach(r => Object.defineProperty(r, '_c', { value: ci, writable: true, enumerable: false })));
    prog.close();
    toast(`Imported ${nfmt(rows.length)} orders.`, 'ok');
    S.upload = { done: true, batchId };
    route();
  } catch (e) {
    prog.close();
    if (e && e.code === 'cancelled') return toast('Import cancelled (nothing was listed).');
    console.error(e); toast('Import failed: ' + (e.message || e), 'err');
  }
}

/* ================= boot ================= */
async function boot() {
  shell();
  const main = $('#main');
  main.append(h('div', { class: 'page' }, h('div', { class: 'card empty' }, h('b', null, 'Loading Mirsal Airway Bills Creator…'), 'Connecting to your saved templates and orders.')));
  await Store.init();
  updatePill();
  try {
    let st = await Store.getSettings();
    const fresh = !st;
    st = Object.assign(defaultSettings(), st || {});
    if (!st.profiles || !st.profiles.length) st.profiles = DEFAULT_PROFILES();
    S.settings = st;
    S.templates = await Store.listTemplates();
    for (const t of S.templates) if (upgradeTemplate(t)) { try { await Store.saveTemplate(t); } catch (e) { console.warn('upgrade', e); } }
    // Install the supplied 4×6 form layout as the default without deleting other templates.
    // Keep an existing copy (including any edits) on subsequent launches.
    let bundled = getTpl(BUNDLED_DEFAULT_TEMPLATE.id);
    if (!bundled) {
      bundled = clone(BUNDLED_DEFAULT_TEMPLATE);
      upgradeTemplate(bundled);
      await persistTemplate(bundled);
    }
    if (S.settings.defaultTemplateId !== bundled.id || !S.settings.formLayout) {
      S.settings.defaultTemplateId = bundled.id;
      S.settings.formLayout = 1;
      await saveSettings();
    }
    S.batches = await Store.listBatches();
  } catch (e) {
    console.error(e);
    Store.mode = 'error'; updatePill();
    main.innerHTML = '';
    main.append(h('div', { class: 'page' }, h('div', { class: 'card empty' }, h('b', null, 'Your saved data could not be reached'), String(e && e.message || e), h('div', { style: { marginTop: '14px' } }, btn('Try again', { kind: 'primary', onclick: () => location.reload() })))));
    return;
  }
  S.ready = true;
  R.ensureFonts();
  window.addEventListener('hashchange', route);
  route();
}
document.addEventListener('DOMContentLoaded', boot);

    P.append(h('div', { class: 'field' }, h('label', { class: 'f' }, 'Description'), h('input', { class: 'inp sm', value: t.description || '', placeholder: 'e.g. Thermal 4×6 for DXB8 orders', oninput: e => this.mutate('desc', () => t.description = e.target.value) })));
    const w = h('input', { class: 'inp sm', type: 'number', step: 0.1, value: t.page.w }), hh = h('input', { class: 'inp sm', type: 'number', step: 0.1, value: t.page.h });
    const scale = h('input', { type: 'checkbox', checked: true });
    P.append(h('h4', null, 'Label size (mm)'), h('div', { class: 'pgrid' }, h('div', { class: 'field' }, h('label', { class: 'f' }, 'Width'), w), h('div', { class: 'field' }, h('label', { class: 'f' }, 'Height'), hh)),
      h('label', { class: 'chk', style: { marginBottom: '8px' } }, scale, 'Scale the design with the size'),
      btn('Apply size', { sm: true, onclick: () => this.setPage(clamp(+w.value || t.page.w, 10, 600), clamp(+hh.value || t.page.h, 10, 600), scale.checked) }),
      btn('Swap to landscape / portrait', { sm: true, kind: 'ghost', onclick: () => this.setPage(t.page.h, t.page.w, false) }));
    const gs = h('select', { class: 'inp sm', onchange: e => { this.grid = +e.target.value; lsSet('grid', this.grid); this.drawGrid(); } }, [0.5, 1, 2, 2.5, 5].map(g => h('option', { value: g }, g + ' mm')));
    gs.value = this.grid;
    P.append(h('h4', null, 'Grid & snapping'), h('div', { class: 'pgrid' }, h('div', { class: 'field' }, h('label', { class: 'f' }, 'Grid size'), gs),
      h('div', { class: 'field' }, h('label', { class: 'f' }, ' '), h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: this.snap, onchange: e => { this.snap = e.target.checked; lsSet('snap', this.snap); this.updateTop(); } }), 'Snap'))));
    const bg = h('input', { type: 'color', value: t.bg || '#ffffff', oninput: e => this.mutate('bg', () => t.bg = e.target.value) });
    P.append(h('h4', null, 'Background'), h('div', { class: 'color-row' }, bg, h('span', { class: 'small-muted' }, 'Keep white for thermal printers')));
    P.append(h('h4', null, 'Shortcuts'), h('div', { class: 'small-muted', style: { lineHeight: 1.9 } },
      h('span', { class: 'kbd' }, 'Del'), ' delete · ', h('span', { class: 'kbd' }, 'Ctrl+D'), ' duplicate · ', h('span', { class: 'kbd' }, 'Ctrl+C / V'), ' copy & paste · ',
      h('span', { class: 'kbd' }, 'Ctrl+Z / Y'), ' undo & redo · ', h('span', { class: 'kbd' }, '←↑→↓'), ' nudge (Shift ×10) · ', h('span', { class: 'kbd' }, 'Alt'), ' drag without snapping · ',
      h('span', { class: 'kbd' }, 'Shift'), ' drag straight / keep proportions · ', h('span', { class: 'kbd' }, 'Ctrl+S'), ' save · ', h('span', { class: 'kbd' }, 'Ctrl + wheel'), ' zoom'));
  },
  choosePreset(id) {
    const p = PAGE_PRESETS.find(x => x.id === id);
    if (!p || id === 'custom') { this.sel = []; this.renderProps(); toast('Enter a custom width and height on the right, then press “Apply size”.'); this.updateTop(); return; }
    this.setPage(p.w, p.h, true);
  },
  setPage(w, hh, scale) {
    const pre = this.snap_();
    if (scale) scaleElements(this.t, this.t.page.w, this.t.page.h, w, hh);
    const p = PAGE_PRESETS.find(x => x.id !== 'custom' && Math.abs(x.w - w) < 0.05 && Math.abs(x.h - hh) < 0.05);
    this.t.page = { preset: p ? p.id : 'custom', w: round2(w), h: round2(hh) };
    this.push(pre); this.fit();
  },

  /* ---------- commands ---------- */
  align(k) {
    const sel = this.selEls().filter(e => !e.locked); if (!sel.length) return;
    let L, T, Rr, B;
    if (sel.length === 1) { L = 0; T = 0; Rr = this.t.page.w; B = this.t.page.h; }
    else { L = Math.min(...sel.map(e => e.x)); T = Math.min(...sel.map(e => e.y)); Rr = Math.max(...sel.map(e => e.x + e.w)); B = Math.max(...sel.map(e => e.y + e.h)); }
    this.mutate('align' + Math.random(), () => sel.forEach(e => {
      if (k === 'l') e.x = L; if (k === 'r') e.x = round2(Rr - e.w); if (k === 'c') e.x = round2((L + Rr) / 2 - e.w / 2);
      if (k === 't') e.y = T; if (k === 'b') e.y = round2(B - e.h); if (k === 'm') e.y = round2((T + B) / 2 - e.h / 2);
    }));
    this.render(); this.syncGeom();
  },
  distribute(ax) {
    const sel = this.selEls().filter(e => !e.locked); if (sel.length < 3) return;
    const sz = ax === 'x' ? 'w' : 'h';
    sel.sort((a, b) => a[ax] - b[ax]);
    const start = sel[0][ax], end = sel[sel.length - 1][ax] + sel[sel.length - 1][sz];
    const total = sel.reduce((a, e) => a + e[sz], 0), gap = (end - start - total) / (sel.length - 1);
    this.mutate('dist' + Math.random(), () => { let p = start; for (const e of sel) { e[ax] = round2(p); p += e[sz] + gap; } });
    this.render();
  },
  order(k) {
    const e = this.selEls()[0]; if (!e) return;
    this.mutate('order' + Math.random(), () => {
      const a = this.t.elements, i = a.indexOf(e); a.splice(i, 1);
      const j = k === 'front' ? a.length : k === 'back' ? 0 : k === 'up' ? Math.min(a.length, i + 1) : Math.max(0, i - 1);
      a.splice(j, 0, e);
    });
    this.full();
  },
  remove() {
    const ids = this.selEls().filter(e => !e.locked).map(e => e.id); if (!ids.length) return;
    this.mutate('del' + Math.random(), () => { this.t.elements = this.t.elements.filter(e => !ids.includes(e.id)); });
    this.sel = []; this.full();
  },
  duplicate(src) {
    const items = src || this.selEls(); if (!items.length) return;
    const pre = this.snap_();
    const copies = items.map(e => { const c = clone(e); c.id = uid('e'); c.x = round2(Math.min(e.x + 3, this.t.page.w - e.w)); c.y = round2(Math.min(e.y + 3, this.t.page.h - e.h)); c.locked = false; if (c.name) c.name += ' copy'; return c; });
    this.t.elements.push(...copies); this.push(pre);
    this.sel = copies.map(c => c.id); this.full();
  },
  nudge(dx, dy) {
    const sel = this.selEls().filter(e => !e.locked); if (!sel.length) return;
    this.mutate('nudge', () => sel.forEach(e => { e.x = round2(e.x + dx); e.y = round2(e.y + dy); }));
    this.syncGeom();
  },
  key(e) {
    if (!this.active || $('.modal-bg')) return;
    const mod = e.ctrlKey || e.metaKey;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); this.save(); return; }
    if (typing) return;
    const k = e.key.toLowerCase();
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? this.redo() : this.undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); this.redo(); return; }
    if (mod && k === 'd') { e.preventDefault(); this.duplicate(); return; }
    if (mod && k === 'c') { if (this.sel.length) { this.clip = clone(this.selEls()); e.preventDefault(); } return; }
    if (mod && k === 'v') { if (this.clip) { e.preventDefault(); this.duplicate(this.clip); } return; }
    if (mod && k === 'a') { e.preventDefault(); this.sel = this.t.elements.filter(x => !x.hidden).map(x => x.id); this.afterSel(); return; }
    if (k === 'delete' || k === 'backspace') { if (this.sel.length) { e.preventDefault(); this.remove(); } return; }
    if (k === 'escape') { this.sel = []; this.afterSel(); return; }
    const st = e.shiftKey ? 5 : e.altKey ? 0.1 : 0.5;
    const map = { arrowleft: [-st, 0], arrowright: [st, 0], arrowup: [0, -st], arrowdown: [0, st] };
    if (map[k] && this.sel.length) { e.preventDefault(); this.nudge(...map[k]); }
  },
  openFields() {
    const pre = this.snap_();
    const before = JSON.stringify(this.t.fields) + JSON.stringify(this.t.sample);
    openFieldsModal(this.t, {
      columns: knownColumns(),
      onChange: () => { this.dirty = true; this.updateTop(); this.schedule(); },
      onClose: () => { if (JSON.stringify(this.t.fields) + JSON.stringify(this.t.sample) !== before) { this.hist.push(pre); this.fut = []; } this.full(); }
    });
  },
  async testPrint() {
    const prof = currentProfile();
    await exportJobs([{ tpl: this.t, ctx: this.ctx(), name: 'TEST_' + (this.t.name || 'template') }], 'pdf', prof);
  }
};
